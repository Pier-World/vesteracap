<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Vestera Capital Partners — an investment firm partnering with generational funds and founders. Based in New York and San Francisco."
    />
    <meta name="theme-color" content="#F9F8F3" />
    <title>Vestera Capital Partners</title>
    <link rel="icon" href="/public/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page" aria-label="Vestera Capital Partners">
      <header class="corners corners--top">
        <div class="clocks" aria-live="polite">
          <p class="clock">
            <span class="clock__city">New York</span>
            <time id="clock-ny" datetime="" class="clock__time">--:--:--</time>
          </p>
          <p class="clock">
            <span class="clock__city">San Francisco</span>
            <time id="clock-sf" datetime="" class="clock__time">--:--:--</time>
          </p>
        </div>
        <a class="contact" href="mailto:hello@vestera.capital">Contact</a>
      </header>

      <h1 class="wordmark">Vestera</h1>

      <img
        class="logo"
        src="/public/logo.png"
        alt="Vestera Capital Partners architectural emblem"
        width="1024"
        height="1024"
        decoding="async"
      />

      <footer class="corners corners--bottom">
        <p class="tagline">
          An investment firm partnering with generational funds and founders.
        </p>
        <p class="firm">Vestera Capital Partners</p>
      </footer>
    </main>
    <script src="/clocks.js" defer></script>
  </body>
</html>
